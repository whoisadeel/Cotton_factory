{% extends "base.html" %}{% block title %}{{ title }}{% endblock %}{% block page_title %}{{ title }}{% endblock %}{% block content %}<div class="max-w-2xl mx-auto animate-fadeIn"><div class="bg-white rounded-2xl border shadow-sm p-6"><form method="post">{% csrf_token %}<div class="grid grid-cols-1 sm:grid-cols-2 gap-4"><div class="sm:col-span-2"><label class="block text-sm font-semibold text-gray-700 mb-1">Name (e.g., 2026-2027)</label><input type="text" name="name" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm outline-none focus:border-emerald-500"></div><div><label class="block text-sm font-semibold text-gray-700 mb-1">Start Date</label><input type="date" name="start_date" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm outline-none focus:border-emerald-500"></div><div><label class="block text-sm font-semibold text-gray-700 mb-1">End Date</label><input type="date" name="end_date" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm outline-none focus:border-emerald-500"></div><div><label class="flex items-center gap-2 mt-6"><input type="checkbox" name="is_current" class="w-5 h-5 text-emerald-600 rounded"><span class="text-sm text-gray-700">Set as Current Year</span></label></div></div><div class="mt-6 flex justify-between"><a href="{% url 'settings_app:financial_years' %}" class="px-5 py-2.5 text-sm text-gray-600 border-2 border-gray-200 rounded-xl hover:bg-gray-50">← Back</a><button type="submit" class="px-8 py-3 bg-gradient-to-r from-emerald-600 to-emerald-500 text-white rounded-xl font-bold shadow-lg shadow-emerald-500/25">Save</button></div></form></div></div>{% endblock %}
