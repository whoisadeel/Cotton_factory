{% extends "base.html" %}
{% load humanize %}

{% block title %}Parties — پارٹیاں
{% endblock %}
{% block page_title %}Parties — پارٹیاں
{% endblock %}

{% block content %}
<div class="space-y-4">

    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div></div>
        <a href="{% url 'parties:party_create' %}"
           class="inline-flex items-center px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium rounded-lg transition-colors">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            Add Party
        </a>
    </div>

    <!-- Filters -->
    <div class="bg-white rounded-xl border border-gray-200 p-4">
        <form method="get" class="flex flex-col sm:flex-row gap-3"
              hx-get="{% url 'parties:party_list' %}"
              hx-target="#party-table"
              hx-trigger="change, input delay:300ms from:find input[name=search]">
            <div class="flex-1">
                <input type="text" name="search" value="{{ search }}" placeholder="Search by name, code, phone, CNIC..."
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-sm">
            </div>
            <select name="type"
                    class="px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-sm">
                <option value="">All Types</option>
                {% for value, label in type_choices %}
                <option value="{{ value }}" {% if selected_type == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
            <select name="status"
                    class="px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-sm">
                <option value="">All Status</option>
                <option value="active" {% if selected_status == 'active' %}selected{% endif %}>Active</option>
                <option value="inactive" {% if selected_status == 'inactive' %}selected{% endif %}>Inactive</option>
            </select>
        </form>
    </div>

    <!-- Party Table -->
    <div id="party-table">
        {% include "parties/partials/party_table.html" %}
    </div>
</div>
{% include "components/pagination.html" %}
{% endblock %}
