<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Expired — صفحہ ختم ہو گیا</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f6fb; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: white; border-radius: 20px; padding: 40px; max-width: 450px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        .icon { font-size: 56px; margin-bottom: 16px; }
        h1 { font-size: 22px; font-weight: 800; color: #1e293b; margin-bottom: 8px; }
        p { font-size: 14px; color: #6b7280; line-height: 1.6; margin-bottom: 20px; }
        .ur { font-size: 15px; color: #9ca3af; direction: rtl; margin-bottom: 20px; }
        .btn { display: inline-block; padding: 14px 32px; background: linear-gradient(135deg, #059669, #10b981); color: white; text-decoration: none; border-radius: 14px; font-weight: 700; font-size: 15px; }
        .btn:hover { box-shadow: 0 6px 20px rgba(5,150,105,0.3); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔄</div>
        <h1>Page Expired</h1>
        <p>This page was open too long and the security token expired. Just go back and try again.</p>
        <div class="ur">صفحہ زیادہ دیر سے کھلا تھا۔ واپس جائیں اور دوبارہ کوشش کریں۔</div>
        <a href="javascript:history.back()" class="btn">← Go Back — واپس جائیں</a>
    </div>
</body>
</html>
