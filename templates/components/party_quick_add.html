{% comment %}Party Quick-Add Modal{% endcomment %}
<div x-data="partyQuickAdd()" :style="open ? 'display:block' : 'display:none'" style="display:none;">

    <div @click="open=false" style="position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:9998;"></div>

    <div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;width:480px;max-width:92vw;">
        <div style="background:white;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,0.2);overflow:hidden;">

            <div style="padding:20px 24px;background:#f8fafc;border-bottom:1px solid #e2e8f0;">
                <div style="display:flex;align-items:center;justify-content:space-between;">
                    <div style="display:flex;align-items:center;gap:14px;">
                        <div style="width:44px;height:44px;background:linear-gradient(135deg,#059669,#10b981);border-radius:12px;display:flex;align-items:center;justify-content:center;">
                            <svg style="width:24px;height:24px;" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
                        </div>
                        <h3 style="font-size:18px;font-weight:800;color:#0f172a;margin:0;" x-text="title"></h3>
                    </div>
                    <button @click="open=false" type="button" style="width:40px;height:40px;border-radius:12px;border:none;background:#f1f5f9;color:#64748b;cursor:pointer;display:flex;align-items:center;justify-content:center;">
                        <svg style="width:20px;height:20px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
            </div>

            <div style="padding:28px;">
                <template x-if="error">
                    <div style="margin-bottom:20px;padding:14px 18px;background:#fef2f2;border:1px solid #fecaca;border-radius:14px;display:flex;align-items:center;gap:10px;">
                        <svg style="width:20px;height:20px;flex-shrink:0;color:#ef4444;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
                        <p style="color:#dc2626;font-size:14px;font-weight:600;margin:0;" x-text="error"></p>
                    </div>
                </template>

                <div style="margin-bottom:20px;">
                    <label style="display:block;font-size:14px;font-weight:700;color:#0f172a;margin-bottom:8px;">
                        Name — نام <span style="color:#ef4444;font-size:16px;">*</span>
                    </label>
                    <input type="text" x-model="name" x-ref="qaNameInput" @keydown.enter.prevent="save()"
                           placeholder="Full name or business name — مکمل نام"
                           class="qa-input">
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px;">
                    <div>
                        <label style="display:block;font-size:13px;font-weight:600;color:#475569;margin-bottom:6px;">Phone — فون</label>
                        <input type="text" x-model="phone" placeholder="03XX XXXXXXX" class="qa-input-sm">
                    </div>
                    <div>
                        <label style="display:block;font-size:13px;font-weight:600;color:#475569;margin-bottom:6px;">City — شہر</label>
                        <input type="text" x-model="city" placeholder="Bahawalpur, Multan..." class="qa-input-sm">
                    </div>
                </div>

                <div style="display:flex;gap:12px;">
                    <button @click="open=false" type="button" class="qa-btn-cancel">
                        Cancel — منسوخ
                    </button>
                    <button @click="save()" :disabled="saving" type="button" class="qa-btn-save"
                            :class="saving && 'qa-btn-saving'">
                        <span x-text="saving ? 'Saving...' : '✓ Save — محفوظ کریں'"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.qa-input {
    width:100%;padding:14px 18px;border:2px solid #e2e8f0;border-radius:14px;
    font-size:16px;font-weight:600;outline:none;background:white;
    box-sizing:border-box;transition:border-color 0.2s,box-shadow 0.2s;
}
.qa-input:focus { border-color:#10b981;box-shadow:0 0 0 4px rgba(16,185,129,0.1); }
.qa-input-sm {
    width:100%;padding:12px 16px;border:2px solid #e2e8f0;border-radius:12px;
    font-size:14px;outline:none;background:white;
    box-sizing:border-box;transition:border-color 0.2s,box-shadow 0.2s;
}
.qa-input-sm:focus { border-color:#10b981;box-shadow:0 0 0 4px rgba(16,185,129,0.1); }
.qa-btn-cancel {
    flex:1;padding:14px;background:white;color:#475569;border:2px solid #e2e8f0;
    border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;
    transition:background 0.15s;
}
.qa-btn-cancel:hover { background:#f8fafc; }
.qa-btn-save {
    flex:1.5;padding:14px;background:linear-gradient(135deg,#059669,#10b981);
    color:white;border:none;border-radius:14px;font-size:16px;font-weight:700;
    cursor:pointer;box-shadow:0 4px 14px rgba(16,185,129,0.3);
    transition:box-shadow 0.15s,opacity 0.15s;
}
.qa-btn-save:hover { box-shadow:0 6px 20px rgba(16,185,129,0.4); }
.qa-btn-saving { opacity:0.6;cursor:wait !important; }
</style>

<script>
function partyQuickAdd() {
    return {
        open: false, title: '', partyType: 'supplier', targetSelectId: '',
        name: '', phone: '', city: '', error: '', saving: false,
        openModal(type, targetId) {
            this.partyType = type; this.targetSelectId = targetId;
            this.name = ''; this.phone = ''; this.city = '';
            this.error = ''; this.saving = false;
            var t = {supplier:'Add Supplier — سپلائر شامل کریں',customer:'Add Customer — گاہک شامل کریں',
                     broker:'Add Broker — دلال شامل کریں',transporter:'Add Transporter — ٹرانسپورٹر شامل کریں'};
            this.title = t[type] || 'Add Party — پارٹی شامل کریں';
            this.open = true;
            var self = this;
            setTimeout(function() { if (self.$refs.qaNameInput) self.$refs.qaNameInput.focus(); }, 100);
        },
        save() {
            if (!this.name.trim()) { this.error = 'Please enter a name — براہ کرم نام لکھیں'; return; }
            this.saving = true; this.error = '';
            var token = ''; var meta = document.querySelector('meta[name="csrf-token"]');
            if (meta) token = meta.getAttribute('content');
            var self = this; var fd = new FormData();
            fd.append('name', this.name.trim()); fd.append('party_type', this.partyType);
            fd.append('phone', this.phone.trim()); fd.append('city', this.city.trim());
            fetch('/parties/api/quick-add/', { method: 'POST', headers: { 'X-CSRFToken': token }, body: fd })
            .then(function(r) { return r.json().then(function(d) { return {ok: r.ok, data: d}; }); })
            .then(function(res) {
                if (!res.ok) { self.error = res.data.error || 'Error'; self.saving = false; return; }
                var d = res.data; var sel = document.getElementById(self.targetSelectId);
                if (sel) {
                    var label = d.name; if (d.city) label += ' — ' + d.city;
                    var opt = new Option(label, d.id, true, true);
                    sel.appendChild(opt); sel.value = d.id;
                    sel.dispatchEvent(new Event('change', {bubbles: true}));
                }
                self.open = false; self.saving = false;
            })
            .catch(function() { self.error = 'Network error — نیٹ ورک کی خرابی'; self.saving = false; });
        }
    };
}
function openQuickAdd(type, targetId) {
    var el = document.querySelector('[x-data*="partyQuickAdd"]');
    if (el && el._x_dataStack) el._x_dataStack[0].openModal(type, targetId);
}
</script>
