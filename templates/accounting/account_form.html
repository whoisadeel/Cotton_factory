{% extends "base.html" %}{% block title %}{{ title }}{% endblock %}{% block page_title %}{{ title }}{% endblock %}{% block content %}<div class="max-w-2xl mx-auto animate-fadeIn"><div class="bg-white rounded-2xl border shadow-sm p-6"><form method="post">{% csrf_token %}<div class="grid grid-cols-1 sm:grid-cols-2 gap-4"><div><label class="block text-sm font-semibold text-gray-700 mb-1">Account Name *</label><input type="text" name="name" value="{{ account.name|default:'' }}" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm outline-none focus:border-emerald-500"></div><div><label class="block text-sm font-semibold text-gray-700 mb-1">Name (Urdu)</label><input type="text" name="name_urdu" value="{{ account.name_urdu|default:'' }}" dir="rtl" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm outline-none focus:border-emerald-500"></div><div><label class="block text-sm font-semibold text-gray-700 mb-1">Code *</label><input type="text" name="code" value="{{ account.code|default:'' }}" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm outline-none focus:border-emerald-500"></div><div><label class="block text-sm font-semibold text-gray-700 mb-1">Group *</label><select name="group" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm bg-white outline-none">{% for g in groups %}<option value="{{ g.pk }}" {% if account.group_id == g.pk %}selected{% endif %}>{{ g.code }} — {{ g.name }}</option>{% endfor %}</select></div><div class="sm:col-span-2"><label class="block text-sm font-semibold text-gray-700 mb-1">Description</label><textarea name="description" rows="2" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm outline-none focus:border-emerald-500">{{ account.description|default:'' }}</textarea></div></div><div class="mt-6 flex justify-between"><a href="{{ back_url }}" class="px-5 py-2.5 text-sm text-gray-600 border-2 border-gray-200 rounded-xl hover:bg-gray-50">← Back</a><button type="submit" class="px-8 py-3 bg-gradient-to-r from-emerald-600 to-emerald-500 text-white rounded-xl font-bold shadow-lg shadow-emerald-500/25">{{ submit_label|default:'Save' }}</button></div></form></div></div>{% endblock %}
