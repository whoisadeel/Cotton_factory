{% extends "base.html" %}{% block title %}New Journal Entry{% endblock %}{% block page_title %}New Journal Entry — نیا جرنل{% endblock %}{% block content %}<div style="max-width:900px;margin:0 auto;width:100%;box-sizing:border-box;"><div style="font-size:13px;color:#6b7280;margin-bottom:12px;"><a href="{% url 'accounting:journal_list' %}" style="color:#059669;text-decoration:none;font-weight:600;">← Journals — جرنل</a></div><div class="max-w-4xl mx-auto animate-fadeIn"><div class="bg-white rounded-2xl border shadow-sm p-6"><form method="post">{% csrf_token %}<div class="grid grid-cols-2 gap-4 mb-6"><div><label class="block text-xs font-semibold text-gray-500 mb-1">Date</label><input type="date" name="date" value="{% now 'Y-m-d' %}" required class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-400"></div><div><label class="block text-xs font-semibold text-gray-500 mb-1">Narration</label><input type="text" name="narration" class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-400"></div></div><div x-data="{rows: 2}"><table class="w-full text-sm mb-4"><thead class="bg-gray-50"><tr><th class="px-3 py-2 text-left text-xs text-gray-500">Account</th><th class="px-3 py-2 text-right text-xs text-gray-500 w-36">Debit</th><th class="px-3 py-2 text-right text-xs text-gray-500 w-36">Credit</th></tr></thead><tbody><template x-for="i in rows" :key="i"><tr><td class="px-3 py-1"><select :name="'account_'+(i-1)" class="w-full px-2 py-2 border border-gray-200 rounded-lg text-sm bg-white"><option value="">— Select Account —</option>{% for a in accounts %}<option value="{{ a.pk }}">{{ a.code }} — {{ a.name }}</option>{% endfor %}</select></td><td class="px-3 py-1"><input type="number" :name="'debit_'+(i-1)" step="0.01" min="0" value="0" class="w-full px-2 py-2 border border-gray-200 rounded-lg text-sm text-right"></td><td class="px-3 py-1"><input type="number" :name="'credit_'+(i-1)" step="0.01" min="0" value="0" class="w-full px-2 py-2 border border-gray-200 rounded-lg text-sm text-right"></td></tr></template></tbody></table><button type="button" @click="rows++" style="padding:8px 16px;background:#dcfce7;color:#166534;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;">+ Add Row — قطار شامل کریں</button></div><div class="mt-6 flex justify-end"><button type="submit" class="px-8 py-3 bg-gradient-to-r from-emerald-600 to-emerald-500 text-white rounded-xl font-bold shadow-lg shadow-emerald-500/25">Post Journal — جرنل پوسٹ کریں</button></div></form></div></div></div>{% endblock %}
