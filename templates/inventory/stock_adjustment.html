{% extends "base.html" %}{% block title %}Stock Adjustment{% endblock %}{% block page_title %}Stock Adjustment — اسٹاک ایڈجسٹمنٹ{% endblock %}{% block content %}<div class="max-w-2xl mx-auto animate-fadeIn"><div class="bg-white rounded-2xl border shadow-sm p-6"><form method="post">{% csrf_token %}<div class="space-y-4"><div><label class="block text-sm font-semibold text-gray-700 mb-1">Product *</label><select name="product" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm bg-white outline-none focus:border-emerald-500">{% for p in products %}<option value="{{ p.pk }}">{{ p.name }} (Current: {{ p.current_stock }} {{ p.unit.abbreviation }})</option>{% endfor %}</select></div><div><label class="block text-sm font-semibold text-gray-700 mb-1">Type</label><select name="adj_type" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm bg-white outline-none"><option value="adjustment_in">Stock IN (+) — اضافہ</option><option value="adjustment_out">Stock OUT (−) — کمی</option></select></div><div><label class="block text-sm font-semibold text-gray-700 mb-1">Quantity *</label><input type="number" name="quantity" step="0.001" min="0" required class="w-full px-4 py-4 border-2 border-gray-200 rounded-xl text-2xl font-bold text-center outline-none focus:border-emerald-500"></div><div><label class="block text-sm font-semibold text-gray-700 mb-1">Reason — وجہ</label><textarea name="reason" rows="2" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm outline-none focus:border-emerald-500" placeholder="Damage, loss, correction..."></textarea></div></div><div class="mt-6 flex justify-between"><a href="{% url 'inventory:stock_overview' %}" class="px-5 py-2.5 text-sm text-gray-600 border-2 border-gray-200 rounded-xl hover:bg-gray-50">← Back</a><button type="submit" class="px-8 py-3 bg-gradient-to-r from-emerald-600 to-emerald-500 text-white rounded-xl font-bold shadow-lg shadow-emerald-500/25">Adjust Stock</button></div></form></div></div>{% endblock %}
