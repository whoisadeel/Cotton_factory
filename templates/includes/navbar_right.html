    <!-- Global Search -->
    <div style="flex:1;max-width:420px;margin:0 20px;position:relative;" x-data="{ query: '', results: [], show: false }"
         @click.outside="show = false">
        <div style="position:relative;">
            <svg style="position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#94a3b8;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="text" x-model="query" placeholder="Search — تلاش کریں..."
                   @input.debounce.300ms="if(query.length >= 2) { fetch('/dashboard/search/?q='+encodeURIComponent(query)).then(r=>r.json()).then(d=>{results=d.results;show=true;}) } else { results=[]; show=false; }"
                   @focus="if(results.length) show=true"
                   style="width:100%;padding:9px 14px 9px 40px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:13px;outline:none;background:var(--page-bg);transition:all 0.2s ease;color:var(--text-primary);"
                   onfocus="this.style.borderColor='var(--accent)';this.style.background='white';this.style.boxShadow='0 0 0 3px rgba(5,150,105,0.08)'"
                   onblur="this.style.borderColor='var(--border)';this.style.background='var(--page-bg)';this.style.boxShadow='none'">
        </div>
        <!-- Search Results -->
        <div x-show="show && results.length > 0" x-transition
             style="display:none;position:absolute;top:100%;left:0;right:0;margin-top:6px;background:white;border-radius:var(--radius);box-shadow:var(--shadow-lg);border:1px solid var(--border);max-height:400px;overflow-y:auto;z-index:50;">
            <template x-for="r in results" :key="r.url">
                <a :href="r.url" @click="show=false"
                   style="display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid #f8fafc;text-decoration:none;color:var(--text-primary);transition:background 0.1s;"
                   onmouseover="this.style.background='var(--accent-light)'" onmouseout="this.style.background='white'">
                    <span style="font-size:18px;flex-shrink:0;" x-text="r.icon"></span>
                    <div style="flex:1;min-width:0;">
                        <div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" x-text="r.title"></div>
                        <div style="font-size:11px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" x-text="r.subtitle"></div>
                    </div>
                    <svg style="width:14px;height:14px;color:#cbd5e1;flex-shrink:0;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                </a>
            </template>
        </div>
        <div x-show="show && query.length >= 2 && results.length === 0" x-transition
             style="display:none;position:absolute;top:100%;left:0;right:0;margin-top:6px;background:white;border-radius:var(--radius);box-shadow:var(--shadow-lg);border:1px solid var(--border);padding:24px;text-align:center;z-index:50;">
            <p style="color:var(--text-secondary);font-size:13px;">No results — کوئی نتیجہ نہیں</p>
        </div>
    </div>

    <!-- User Menu -->
    <div style="position:relative;" x-data="{ open: false }">
        <button @click="open = !open" type="button"
                style="display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid transparent;background:none;transition:all 0.15s;"
                onmouseover="this.style.background='var(--page-bg)';this.style.borderColor='var(--border)'" onmouseout="this.style.background='none';this.style.borderColor='transparent'">
            <div style="width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--sidebar-active-from),var(--sidebar-active-to));display:flex;align-items:center;justify-content:center;color:white;font-size:13px;font-weight:700;letter-spacing:-0.02em;box-shadow:0 2px 8px rgba(5,150,105,0.2);">
                {% if user.first_name %}{{ user.first_name.0|upper }}{{ user.last_name.0|upper }}{% else %}{{ user.username.0|upper }}{% endif %}
            </div>
            <span style="font-size:14px;font-weight:600;color:var(--text-primary);" class="hidden sm:inline">
                {{ user.get_full_name|default:user.username }}
            </span>
            <svg style="width:14px;height:14px;color:var(--text-secondary);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>

        <div x-show="open" @click.outside="open = false" x-cloak x-transition
             style="display:none;position:absolute;right:0;margin-top:8px;width:220px;background:white;border-radius:var(--radius);box-shadow:var(--shadow-lg);border:1px solid var(--border);z-index:50;overflow:hidden;">
            <div style="padding:14px 16px;border-bottom:1px solid var(--border);background:var(--page-bg);">
                <p style="font-size:14px;font-weight:700;color:var(--text-primary);">{{ user.get_full_name|default:user.username }}</p>
                {% if user.email %}<p style="font-size:12px;color:var(--text-secondary);margin-top:2px;">{{ user.email }}</p>{% endif %}
            </div>
            <div style="padding:6px;">
                <a href="{% url 'authentication:profile' %}" style="display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:13px;color:var(--text-primary);border-radius:8px;text-decoration:none;font-weight:500;" onmouseover="this.style.background='var(--page-bg)'" onmouseout="this.style.background=''">
                    <svg style="width:16px;height:16px;color:var(--text-secondary);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    Profile — پروفائل
                </a>
                <a href="{% url 'settings_app:index' %}" style="display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:13px;color:var(--text-primary);border-radius:8px;text-decoration:none;font-weight:500;" onmouseover="this.style.background='var(--page-bg)'" onmouseout="this.style.background=''">
                    <svg style="width:16px;height:16px;color:var(--text-secondary);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    Settings — ترتیبات
                </a>
            </div>
            <div style="border-top:1px solid var(--border);padding:6px;">
                <form method="post" action="{% url 'authentication:logout' %}">
                    {% csrf_token %}
                    <button type="submit" style="display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:13px;color:#dc2626;width:100%;border:none;background:none;cursor:pointer;text-align:left;border-radius:8px;font-weight:500;" onmouseover="this.style.background='#fef2f2'" onmouseout="this.style.background=''">
                        <svg style="width:16px;height:16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                        Logout — خارج
                    </button>
                </form>
            </div>
        </div>
    </div>
