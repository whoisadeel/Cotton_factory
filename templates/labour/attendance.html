{% extends "base.html" %}{% block title %}Attendance{% endblock %}{% block page_title %}Daily Attendance — حاضری{% endblock %}{% block content %}<div class="max-w-4xl mx-auto space-y-4 animate-fadeIn"><div class="bg-white rounded-2xl border shadow-sm p-5"><form method="get" class="flex items-end gap-3"><div><label class="block text-xs font-semibold text-gray-500 mb-1">Date (تاریخ)</label><input type="date" name="date" value="{{ day|date:'Y-m-d' }}" class="px-3 py-2 border border-gray-200 rounded-xl text-sm outline-none"></div><button type="submit" class="px-5 py-2 bg-emerald-600 text-white rounded-xl text-sm font-bold">Show</button></form></div><div class="bg-white rounded-2xl border shadow-sm p-5"><form method="post">{% csrf_token %}<div class="overflow-x-auto"><table class="w-full text-sm mb-4"><thead class="bg-gray-50"><tr><th class="px-3 py-2 text-left text-xs text-gray-500">Worker</th><th class="px-3 py-2 text-center text-xs text-gray-500">Status</th><th class="px-3 py-2 text-center text-xs text-gray-500 w-24">OT Hours</th></tr></thead><tbody class="divide-y divide-gray-100">{% for d in data %}<tr class="hover:bg-gray-50"><td class="px-3 py-2 font-medium">{{ d.worker.name }}</td><td class="px-3 py-2 text-center"><select name="status_{{ d.worker.pk }}" class="px-2 py-1 border border-gray-200 rounded-lg text-sm bg-white">{% for val, label in statuses %}<option value="{{ val }}" {% if d.status == val %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></td><td class="px-3 py-2 text-center"><input type="number" name="overtime_{{ d.worker.pk }}" value="{{ d.overtime }}" step="0.5" min="0" class="w-20 px-2 py-1 border border-gray-200 rounded-lg text-sm text-center mx-auto"></td></tr>{% endfor %}</tbody></table></div><div class="flex justify-end"><button type="submit" class="px-8 py-3 bg-gradient-to-r from-emerald-600 to-emerald-500 text-white rounded-xl font-bold shadow-lg shadow-emerald-500/25">Save Attendance — حاضری محفوظ کریں</button></div></form></div></div>{% endblock %}
