{% extends "base.html" %}{% block title %}{{ title }}{% endblock %}{% block page_title %}{{ title }}{% endblock %}{% block content %}<div class="max-w-2xl mx-auto animate-fadeIn"><div class="bg-white rounded-2xl border shadow-sm p-6"><form method="post">{% csrf_token %}<div class="space-y-4"><div><label class="block text-sm font-semibold text-gray-700 mb-1">Worker *</label><select name="worker" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm bg-white outline-none focus:border-emerald-500">{% for w in workers %}<option value="{{ w.pk }}">{{ w.name }}</option>{% endfor %}</select></div><div><label class="block text-sm font-semibold text-gray-700 mb-1">Date</label><input type="date" name="date" value="{% now 'Y-m-d' %}" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm outline-none focus:border-emerald-500"></div><div><label class="block text-sm font-semibold text-gray-700 mb-1">Amount (₨)</label><input type="number" name="amount" step="0.01" required class="w-full px-4 py-4 border-2 border-gray-200 rounded-xl text-2xl font-bold text-center outline-none focus:border-emerald-500"></div><div><label class="block text-sm font-semibold text-gray-700 mb-1">Narration</label><input type="text" name="narration" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-sm outline-none"></div></div><div class="mt-6 flex justify-between"><a href="{{ back_url }}" class="px-5 py-2.5 text-sm text-gray-600 border-2 border-gray-200 rounded-xl hover:bg-gray-50">← Back</a><button type="submit" class="px-8 py-3 bg-gradient-to-r from-emerald-600 to-emerald-500 text-white rounded-xl font-bold shadow-lg">Save Advance</button></div></form></div></div>{% endblock %}
